<html>
<head>
<title>form</title>
<style>
body{
background-color:white;
font-family:arial;
}
.form-box{
width:800px;
merge:50px auto;
padding:25px 40px;
background-color:lightblue;
}
h3{
text-align:center;
margin-top:0;
}
table{
width:100%;
}
td{
padding:10px;
font-size:18px
}
.label{
width:45%;
}
input[type="text"],
input[type="number"],
input[type="email"]{
width:120px;
height:18px;
}
textarea{
width:235px;
height:145px;
}
select{
width:25px;
}
select{
width:7 5px;
}
input[type="file"]{
with:250px;
}
.button input{
merge-right:310px;
}
</style>
</head>
<body>
<div class="form-box">
<h3>Registration Form<h3>
<form>
<table>
<tr>
<td class="label"> full Name</td>
<td>
<input type="text">
</td>
</tr>
<tr>
<td>Mobile Number</td>
<td>
<input type="number">
</td>
</tr>
<tr>
<input type="radio" name="gender">Male
<input type="radio" name="gender">Female
<input type="radio" name="gender">Others
</td>
</tr>
<tr>
<td>Date OF Birth</td>
<td>
<input type="date">
</td>
</tr>
<tr>
<td>Address</td>
<td>
<textarea></textarea>
</td>
</tr>

<td>Current Study</td>
<td>
<select>
<option>Select</option>
<option>B-tech</option>
<option>M-tech</option>
<option>MCA</option>
<option>BCA</option>
</select>
</td>
</tr>

<td>Department</td>
<td>
<select>
<option>Select</option>
<option>CS</option>
<option>EEE</option>
<option>ECE</option>
<option>CIVIL</option>
</select>
</td>
</tr>

<tr>
<td>Upload CV</td>
<td>
<input type="file">
</td>
</tr>

<tr>
<td>Programming Languages</td>
<td>
<input type="checkbox">HTML
<input type="checkbox">React.js
<input type="checkbox">CSS
<input type="checkbox">Python
</td>
</tr>

<tr>
<td>Language</td>
<td>
<input type="checkbox">English
<input type="checkbox">Malayalam
<input type="checkbox">Hindi
<input type="checkbox">Tamil
</td>
</tr>

<tr>
<td>
<input type="submit" value="submit">
</td>
</tr>

<tr>
<td>
<input type="reset" value="reset">
</td>
</tr>
</table>
</form>
</div>
</body>
</html>
